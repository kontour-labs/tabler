#Tabler
# The Tabler Icons release the icons are generated from, and the npm tarball's
# `dist.integrity`, which the download is checked against. The release workflow
# rewrites both when Tabler publishes; bump them together by hand with
#   curl -s https://registry.npmjs.org/@tabler/icons/<version> | jq -r .dist.integrity
tabler.version=3.49.0
tabler.integrity=sha512-l+GnSkFETx0U26icxv1VUFnxxiTqXfCcVRiRAnyMwibupM2S2L/hSaZ9gmSgz01rkrsH/93NvLsxykqdanc6lw==

#Kotlin
kotlin.code.style=official
# In Gradle's own JVM, so there is one heap to size rather than two. Each
# compilation of the outline set is five thousand files, several run at once
# (one per worker), and a separate Kotlin daemon at its usual size ran out of
# memory doing it. GitHub's standard runners have 16 GB for a public repository.
kotlin.compiler.execution.strategy=in-process

#Gradle
# 3 GB of heap came to 5 GB of process at its peak, measured building all six
# targets with two workers, which is what a private repository's 2-core runner
# gets. A public repository's runner has 4 cores, so four workers compile the
# outline set at once in the same heap, and 3 GB ran out of memory on the first
# release built there, v3.49.0.1. 6 GB is the measured figure scaled to four
# workers, inside the runner's 16 GB.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native
# The iOS simulator tests cannot run on Linux, where every build here runs, and
# nothing here has any. The klibs still compile.
kotlin.native.ignoreDisabledTargets=true
